server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The API, proxied so the console and the service share an origin. The browser sees one host, so
  # there is no preflight, no CORS policy to get wrong, and no API hostname compiled into the bundle
  # — the same shape as the single-image Cloud Run deployment.
  #
  # The upstream name is resolved by Docker's embedded DNS at request time rather than at start-up,
  # so the console can boot even if the API is still starting.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Assessments and CAP documents are small, but a rejected oversized body should come back as the
    # API's own 413 problem document rather than as nginx's HTML error page.
    proxy_intercept_errors off;
    proxy_read_timeout 30s;
  }

  # Actuator is proxied too, so the console's health pill and the compose healthcheck agree.
  location /actuator/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $actuator_upstream http://api:8080;
    proxy_pass $actuator_upstream;
  }

  # Single-page application: unknown paths belong to the router, not to a 404 page.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable, so let the browser keep them.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
