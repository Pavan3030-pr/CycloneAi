# Continuous integration: the same two checks a reviewer would run by hand.
#
# The backend job runs the full test suite, which includes the end-to-end API test that asserts the
# security contract (anonymous, wrong password, viewer write, field errors, and both AI paths). The
# frontend job type-checks and builds, so a type error fails the pull request rather than the demo.
#
# Both jobs are independent and run in parallel; the workflow is red if either fails.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify rather than test, so the packaged artefact is built too and a broken build fails here.
      - name: Run the test suite
        run: mvn -B --no-transfer-progress verify

      - name: Publish the test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Console (Node 22, Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Type-check
        run: npm run typecheck

      # With VITE_API_BASE_URL unset the bundle calls /api relative to its own origin, which is the
      # shape the deployed image uses. A build that only works with an absolute API URL should fail
      # here rather than in production.
      - name: Build
        run: npm run build

  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Building the image is the only check that proves the console really is packaged inside the
      # service and that the Dockerfile's three stages still agree with each other.
      - name: Build the single-origin image
        run: docker build --tag cycloneai:ci .
