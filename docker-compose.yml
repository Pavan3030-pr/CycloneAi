# Runs the full stack with one command: docker compose up --build
#
# Same-origin, like production: the browser talks only to http://localhost:5173, and nginx in the
# console container proxies /api to the api service. That means the composition exercises the exact
# deployment shape CycloneAI runs in the cloud, and APP_ALLOWED_ORIGINS is only needed for the Vite
# dev server (npm run dev), which does call the API cross-origin.
#
# APP_JWT_SECRET is a local value here; substitute a real secret before using this anywhere shared.
# APP_GEMINI_API_KEY is optional: set it in the environment to have Gemini write the advisories,
# leave it unset and the deterministic generator does, and every response says which one ran.

services:
  api:
    build:
      context: ./backend
    image: cyclone-impact-api:local
    container_name: cyclone-api
    expose:
      - "8080"
    ports:
      # Published for the dev server and for curl/Swagger; the console reaches it over the compose
      # network at http://api:8080.
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      APP_JWT_SECRET: "${APP_JWT_SECRET:-local-compose-demo-secret-change-me-32b}"
      APP_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      APP_DEMO_ANALYST_PASSWORD: "${APP_DEMO_ANALYST_PASSWORD:-cyclone-demo-analyst}"
      APP_DEMO_ADMIN_PASSWORD: "${APP_DEMO_ADMIN_PASSWORD:-cyclone-demo-admin}"
      APP_DEMO_VIEWER_PASSWORD: "${APP_DEMO_VIEWER_PASSWORD:-cyclone-demo-viewer}"
      APP_RATE_LIMIT_CAPACITY: "120"
      # auto: use Gemini when a key is present, otherwise the deterministic template.
      APP_ADVISORY_MODE: "${APP_ADVISORY_MODE:-auto}"
      APP_GEMINI_API_KEY: "${APP_GEMINI_API_KEY:-}"
      APP_GEMINI_MODEL: "${APP_GEMINI_MODEL:-gemini-2.5-flash}"
      # Enable dispatch by pointing this at a messaging gateway or control-room webhook.
      APP_WEBHOOK_ENABLED: "${APP_WEBHOOK_ENABLED:-false}"
      APP_WEBHOOK_URL: "${APP_WEBHOOK_URL:-}"
      APP_WEBHOOK_TOKEN: "${APP_WEBHOOK_TOKEN:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  console:
    build:
      context: ./frontend
      args:
        # Empty on purpose: the console calls /api on its own origin and nginx forwards it.
        VITE_API_BASE_URL: ""
        VITE_DEMO_USERNAME: "analyst"
        VITE_DEMO_PASSWORD: "${APP_DEMO_ANALYST_PASSWORD:-cyclone-demo-analyst}"
    image: cyclone-impact-console:local
    container_name: cyclone-console
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
